{% extends 'tienda/base.html' %}{% block content %}<h1>GESTIÓN DE USUARIOS</h1><div id="users" class="grid"></div>{% endblock %}{% block scripts %}<script>fetch('/api/usuarios/').then(r=>r.json()).then(a=>document.getElementById('users').innerHTML=a.map(u=>`<article class="tile"><b>${u.usuario||''}</b><p>${u.email||''}</p><p>${u.rol||''} · ${u.activo?'Activo':'Inactivo'}</p></article>`).join(''));</script>{% endblock %}
