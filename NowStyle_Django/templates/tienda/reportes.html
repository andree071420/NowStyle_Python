{% extends 'tienda/base.html' %}{% block content %}<h1>HISTORIAL DE PEDIDOS</h1><div id="orders" class="grid"></div>{% endblock %}{% block scripts %}<script>fetch('/api/pedidos/').then(r=>r.json()).then(a=>document.getElementById('orders').innerHTML=a.map(p=>`<article class="tile"><h3>Pedido #${p.id}</h3><p>${p.usuarioEmail||''}</p><p>Estado: ${p.estado||''}</p><strong>Total: $${p.total||0}</strong></article>`).join('')||'<p>No hay pedidos.</p>');</script>{% endblock %}
