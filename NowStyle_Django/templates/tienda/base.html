{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NowStyle</title><link rel="stylesheet" href="{% static 'css/index.css' %}"><link rel="stylesheet" href="{% static 'css/App.css' %}"><style>body{padding-top:82px}.page{max-width:1180px;margin:35px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.tile,.formbox{background:#101014;border:1px solid #29292f;border-radius:12px;padding:20px}.tile h3{margin:8px 0}.muted{color:#aaa}.field{display:block;width:100%;padding:12px;margin:8px 0 16px;background:#18181b;border:1px solid #333;color:white;border-radius:7px}.action{display:inline-block;background:#dc2626;color:white;padding:11px 17px;border:0;border-radius:6px;cursor:pointer}.action.secondary{background:#333}.navbar{position:fixed}.nav-links a{color:white}.model-view{height:460px;background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}#model3d{width:100%;height:100%} .notice{padding:12px;background:#202027;border-radius:8px;margin:12px 0}</style></head><body><nav class="navbar"><a class="navbar-logo" href="/">NOW<span>STYLE</span></a><div class="nav-links"><a href="/catalogo/">Catálogo</a><a href="/personalizar-estampado/">Personalizar</a><a href="/login/" class="btn-nav-outline">Ingresar</a><a href="/register/" class="btn-nav-primary">Registrarse</a></div></nav><main class="page">{% if messages %}{% for message in messages %}<div class="notice">{{message}}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><script src="{% static 'js/app.js' %}"></script>{% block scripts %}{% endblock %}</body></html>
