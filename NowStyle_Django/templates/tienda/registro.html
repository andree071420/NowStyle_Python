{% extends 'tienda/base.html' %}{% block content %}<div class="auth-container"><section class="auth-card"><header class="auth-header"><h1 class="auth-title">CREAR <span>CUENTA</span></h1></header><form id="registerForm" class="auth-form">{% for field,label in fields %}{% endfor %}<div class="auth-group"><label>Nombre de usuario</label><input class="field" name="usuario" minlength="4" required></div><div class="auth-group"><label>Correo Gmail</label><input class="field" name="email" type="email" required></div><div class="auth-group"><label>Teléfono</label><input class="field" name="telefono" required></div><div class="auth-group"><label>Contraseña (mínimo 8 caracteres)</label><input class="field" name="password" type="password" minlength="8" required></div><button class="auth-button">REGISTRARME</button><p id="feedback" class="muted"></p></form></section></div>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/usuarios/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();if(r.ok)location.href='/login/';else document.getElementById('feedback').textContent=j.error||'No fue posible registrar';});</script>{% endblock %}
