{% extends 'tienda/base.html' %}{% block content %}<h1>INVENTARIO DE PRENDAS</h1><div id="stock" class="grid"></div>{% endblock %}{% block scripts %}<script>fetch('/api/productos/').then(r=>r.json()).then(a=>document.getElementById('stock').innerHTML=a.map(p=>`<article class="tile"><h3>${p.nombre||''}</h3><p>${p.categoria||''} · ${p.color||''}</p><p>${p.tallasStock||''}</p><strong>$${p.precio||0}</strong></article>`).join(''));</script>{% endblock %}
