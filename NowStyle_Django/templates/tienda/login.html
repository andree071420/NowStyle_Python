{% extends 'tienda/base.html' %}{% block content %}<div class="auth-container"><section class="auth-card"><header class="auth-header"><h1 class="auth-title">INICIAR <span>SESIÓN</span></h1><p class="auth-subtitle">Ingresa a tu cuenta NowStyle</p></header><form id="loginForm" class="auth-form"><div class="auth-group"><label>Correo o usuario</label><input class="field" name="email" required></div><div class="auth-group"><label>Contraseña</label><input class="field" name="password" type="password" required></div><button class="auth-button">INGRESAR</button><p id="feedback" class="muted"></p></form><div class="auth-footer"><a href="/recuperar-password/">¿Olvidaste tu contraseña?</a><br><a href="/register/">Crear una cuenta</a></div></section></div>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/usuarios/login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(r.ok)location.href=j.rol==='ADMIN' || j.rol==='EMPLEADO'?'/panel/':'/catalogo/';else document.getElementById('feedback').textContent=j.error||'No fue posible ingresar';});</script>{% endblock %}
