{% extends 'tienda/base.html' %}{% block content %}<section class="formbox" style="max-width:650px;margin:auto"><h1>CREAR PRODUCTO</h1><form id="productForm"><label>Nombre</label><input class="field" name="nombre" required><label>Descripción</label><textarea class="field" name="descripcion"></textarea><label>Categoría</label><select class="field" name="categoria"><option>Camiseta</option><option>Hoodie</option><option>Pantalón</option></select><label>Color</label><input class="field" name="color"><label>Precio</label><input class="field" name="precio" type="number" step="0.01"><label>Stock por tallas (JSON o texto)</label><input class="field" name="tallasStock"><label>Imagen (URL o data URI)</label><input class="field" name="imagen"><button class="action">GUARDAR PRODUCTO</button><p id="feedback"></p></form></section>{% endblock %}{% block scripts %}<script>document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.precio=Number(d.precio||0);let r=await fetch('/api/productos/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.getElementById('feedback').textContent=r.ok?'Producto guardado':'No se pudo guardar el producto';if(r.ok)e.target.reset();});</script>{% endblock %}
